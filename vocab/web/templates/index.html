<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="description" content="A focused vocabulary workspace for spaced review, active recall, and measurable practice.">
  <title>Vocab · Learning workspace</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body class="eco-app eco-vocab eco-navigation">
  <a class="skip-link" href="#content">Skip to content</a>
  <aside class="sidebar eco-sidebar" id="workspace-sidebar">
    <button type="button" class="brand" id="sidebar-toggle" aria-controls="workspace-sidebar" aria-label="Collapse sidebar"><span class="brand-mark">v.</span><span class="sidebar-label">vocab<span class="brand-sub">LEARNING WORKSPACE</span></span></button>
    <div class="nav-label">WORKSPACE</div>
    <nav aria-label="Main navigation" id="navigation"></nav>
    <div class="sidebar-bottom">
      <div class="connection-status"><span class="connection-dot" id="live-dot" title="Realtime sync active"></span><span id="connection-label">Live workspace</span></div>
      <p>One library. Terminal + web.</p>
      <button class="button small ghost sidebar-shortcuts-btn" data-action="shortcuts-help" title="View keyboard move set (?)">Move set <kbd>?</kbd></button>
      <a href="#research">Research & methodology <span aria-hidden="true">↗</span></a>
    </div>
  </aside>
  <div class="workspace eco-main">
    <header class="topbar eco-topbar">
      <div><span class="breadcrumb">Workspace</span><span class="slash">/</span><span id="page-label">Overview</span></div>
      <div class="scope">
        <button class="button small ghost topbar-shortcuts-btn" data-action="shortcuts-help" title="Keyboard move set (?)">Move set <kbd>?</kbd></button>
        <label for="deck-scope">Deck</label>
        <select id="deck-scope"><option value="">All decks</option></select>
        <button class="button small" data-action="add-word">+ Add word</button>
      </div>
    </header>
    <main id="content" tabindex="-1"><div class="loading">Opening your workspace…</div></main>
    <footer class="footer"><span>Built for deliberate practice.</span><a href="#research">SM-2 scheduling · Research notes</a></footer>
  </div>
  <dialog class="eco-dialog eco-settings" id="settings-dialog" aria-labelledby="settings-dialog-title"><div class="eco-dialog-heading"><h2 id="settings-dialog-title">Settings</h2><button type="button" class="eco-dialog-close" aria-label="Close dialog" data-eco-close>×</button></div><div id="settings-content"></div></dialog>
  <dialog class="eco-dialog" id="modal" aria-label="Editor"></dialog>
  <div class="eco-dialog-feedback" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
